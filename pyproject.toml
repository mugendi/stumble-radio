[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stumble-radio"
version = "0.1.6"
description = "A terminal radio for curious ears. Stumble into something good."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=1.0,<9", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[project.scripts]
stumble-radio = "stumble_radio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stumble_radio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

